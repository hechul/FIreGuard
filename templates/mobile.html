<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FireGuard · 위치별 대피 안내</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_guidance.css', v='qr-20261120') }}">
  {% for file in ['map_geometry', 'prototype_projection', 'real_led_projection', 'zone_guidance', 'mobile_guidance'] %}
  <script defer src="{{ url_for('static', filename='js/' ~ file ~ '.js', v='qr-20261120') }}"></script>
  {% endfor %}
</head>
<body>
  <main class="wrap" data-node="{{ node_id }}">
    <header class="brand"><span>FIREGUARD</span><small id="mode">대피 안내</small></header>
    <section class="card" aria-labelledby="location">
      <span class="tag">QR 설치 위치</span>
      <h1 class="loc" id="location">{{ node_id }}</h1>
      <div class="status" id="status" role="status"><strong id="statusTitle">상태 확인 중</strong><span id="statusDetail"></span></div>
      <div id="guidance" hidden>
        <p class="tag" id="destinationLabel">안내 목적지</p>
        <h2 class="exit" id="exit"></h2>
        <p class="next" id="next"></p>
        <svg id="mobileMap" role="img" aria-label="QR 위치에서 목적지까지의 대피 경로"></svg>
        <p class="route" id="route"></p>
      </div>
      <p class="footer">현장에서는 LED 유도등과 안전요원의 지시를 따르세요.</p>
    </section>
  </main>
</body>
</html>
