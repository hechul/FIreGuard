<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FireGuard Mobile</title>
  <style>
    :root{--bg:#f4f6f8;--surface:#fff;--text:#191f28;--muted:#8b95a1;--line:#e5e8eb;--blue:#3182f6;--blueSoft:#eaf3ff;--safe:#20c997;--safeSoft:#e9fbf5;--orange:#ff7e36;--danger:#f04452;--dangerSoft:#fff0f2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:480px;margin:auto;padding:22px 18px 42px}.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:900;letter-spacing:-.4px}.brand:before{content:"F";display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--orange),#ff9a60);color:#fff;font-size:18px;box-shadow:0 7px 16px rgba(255,126,54,.2)}.brand span{color:var(--text)}.card{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 28px rgba(27,39,51,.06)}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--blueSoft);color:#286bc5;font-size:11px;font-weight:800}.loc{font-size:38px;font-weight:900;letter-spacing:-1.5px;margin:13px 0 5px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.status{margin-top:20px;border-radius:18px;padding:17px;background:var(--safeSoft)}.status.danger{background:var(--dangerSoft)}.status strong{display:block;font-size:20px;letter-spacing:-.5px;color:#129b74}.status.danger strong{color:var(--danger)}.status span{display:block;color:#6f7b88;font-size:11px;margin-top:5px;line-height:1.5}.exit{margin-top:14px;background:var(--blue);color:white;border-radius:18px;padding:23px;text-align:center;font-size:29px;font-weight:900;letter-spacing:-1px;box-shadow:0 8px 18px rgba(49,130,246,.2)}.route{margin-top:12px;padding:15px;border-radius:16px;background:#f7f8fa;color:#5f6b77;font-size:12px;line-height:1.65}.footer{margin-top:18px;text-align:center;color:#9aa3ad;font-size:10px;line-height:1.5}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span>FIREGUARD</span></div>
    <section class="card">
      <span class="tag">현재 위치</span>
      <div class="loc">{{ node_id }}</div>
      <div class="muted">관제 시스템이 계산한 현재 대피 정보를 표시합니다.</div>
      <div id="status" class="status"><strong>상태 확인 중</strong><span>서버에서 최신 정보를 불러오고 있습니다.</span></div>
      <div id="exit" class="exit">EXIT 확인 중</div>
      <div id="route" class="route">대피 경로를 불러오는 중입니다.</div>
      <div class="footer">현장에서는 LED 유도등과 안전요원의 지시에 따라 이동하세요.</div>
    </section>
  </main>
  <script>
    const nodeId={{ node_id|tojson }};
    async function refresh(){
      try{
        const [state,floor]=await Promise.all([fetch('/api/state').then(r=>r.json()),fetch('/api/floorplan').then(r=>r.json())]);
        const names={}; [...floor.nodes,...floor.exits].forEach(n=>names[n.id]=n.name||n.id);
        const status=document.getElementById('status');
        status.classList.toggle('danger',state.overallStatus==='fire'||state.overallStatus==='no_route');
        status.querySelector('strong').textContent=state.overallStatus==='normal'?'SAFE':state.overallStatus==='warning'?'WARNING':state.overallStatus==='fire'?'FIRE DETECTED':'NO SAFE ROUTE';
        status.querySelector('span').textContent=state.failSafeActive?'서버 단절 상태입니다. 현장 로컬 유도는 계속 동작합니다.':'관제 시스템과 연결되어 있습니다.';
        document.getElementById('exit').textContent=state.selectedDestinationName||state.selectedExitName||'안전 경로 없음';
        if(state.fallbackActive){
          document.getElementById('exit').textContent='보조 대피지점 · '+(state.selectedDestinationName||'확인 필요');
          status.querySelector('strong').textContent='EMERGENCY ROUTE';
          status.querySelector('span').textContent='정규 비상구가 차단되어 지정된 보조 대피지점으로 안내 중입니다.';
        }
        document.getElementById('route').textContent=state.route?state.route.nodes.map(id=>names[id]||id).join(' → '):'현재 안전한 대피 경로를 찾을 수 없습니다.';
      }catch(e){document.getElementById('status').querySelector('strong').textContent='CONNECTION LOST';}
    }
    refresh(); setInterval(refresh,1500);
  </script>
</body>
</html>
